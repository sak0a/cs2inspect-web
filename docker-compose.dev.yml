# Development Docker Compose Configuration
# Optimized for local development with hot reload and debugging

services:
  database:
    image: mariadb:10.11
    container_name: cs2inspect-dev-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-csinspect}
      MYSQL_USER: ${DATABASE_USER:-csinspect}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-csinspect}
    volumes:
      - db_data_dev:/var/lib/mysql
    ports:
      - "3306:3306"  # Expose for direct access
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: build  # Use build stage (has bun + node + source)
    container_name: cs2inspect-dev-web
    restart: unless-stopped
    environment:
      # Core
      - NODE_ENV=development
      - PORT=${PORT:-3210}
      - HOST=${HOST:-0.0.0.0}

      # JWT / Auth
      - JWT_TOKEN=${JWT_TOKEN}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}

      # Database
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-csinspect}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-csinspect}
      - DATABASE_NAME=${DATABASE_NAME:-csinspect}
      - DATABASE_CONNECTION_LIMIT=${DATABASE_CONNECTION_LIMIT:-5}

      # Steam
      - STEAM_API_KEY=${STEAM_API_KEY}

      # Steam Service (optional for dev)
      - STEAM_SERVICE_URL=${STEAM_SERVICE_URL:-}
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_KEY:-}

      # Logging
      - LOG_API_REQUESTS=true
    ports:
      - "${PORT:-3210}:${PORT:-3210}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dev-network
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    command: bun run dev

networks:
  dev-network:
    driver: bridge

volumes:
  db_data_dev:
    driver: local
