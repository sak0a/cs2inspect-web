<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weapon Video Sizes</title>
<style>
  :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --text: #e0e0e0; --muted: #888; --accent: #6c9eff; --accent2: #ff6c9e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.85rem; }

  #search { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 1rem; margin-bottom: 20px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: #555; }

  .weapon-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s; }
  .weapon-card:hover { border-color: #444; }
  .weapon-header { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; gap: 12px; user-select: none; }
  .weapon-header:hover { background: rgba(255,255,255,0.02); }
  .weapon-name { font-weight: 700; font-size: 0.95rem; min-width: 130px; }
  .weapon-res-pills { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .res-pill { padding: 3px 10px; border-radius: 4px; background: rgba(255, 108, 158, 0.12); color: var(--accent2); font-family: monospace; font-size: 0.8rem; white-space: nowrap; }
  .res-pill .pill-count { color: var(--muted); font-size: 0.7rem; margin-left: 4px; }
  .weapon-total { color: var(--muted); font-size: 0.8rem; min-width: 60px; text-align: right; }
  .chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; min-width: 16px; text-align: center; }
  .weapon-card.open .chevron { transform: rotate(90deg); }

  .weapon-body { display: none; border-top: 1px solid var(--border); }
  .weapon-card.open .weapon-body { display: block; }

  .res-group { padding: 10px 16px; }
  .res-group + .res-group { border-top: 1px solid var(--border); }
  .res-group-header { font-family: monospace; color: var(--accent2); font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; }
  .skin-list { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .skin-item { color: var(--muted); font-size: 0.8rem; }

  .no-results { text-align: center; padding: 40px; color: var(--muted); }
  .match { background: rgba(108, 158, 255, 0.25); border-radius: 2px; }
</style>
</head>

// Build weapon -> { res -> skins[] }
const weaponData = {};
DATA.forEach(d => {
  const res = d.width + 'x' + d.height;
  if (!weaponData[d.weapon]) weaponData[d.weapon] = {};
  if (!weaponData[d.weapon][res]) weaponData[d.weapon][res] = [];
  weaponData[d.weapon][res].push(d.skin);
});

const weapons = Object.keys(weaponData).sort();

function highlight(text, query) {
  if (!query) return text;
  const i = text.toLowerCase().indexOf(query.toLowerCase());
  if (i === -1) return text;
  return text.slice(0, i) + '<span class="match">' + text.slice(i, i + query.length) + '</span>' + text.slice(i + query.length);
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const container = document.getElementById('list');
  let html = '';
  let count = 0;

  weapons.forEach(weapon => {
    const resEntries = Object.entries(weaponData[weapon]).sort((a, b) => b[1].length - a[1].length);
    const total = resEntries.reduce((s, [, skins]) => s + skins.length, 0);

    // Filter: match weapon name, any resolution, or any skin
    if (q) {
      const weaponMatch = weapon.includes(q);
      const resMatch = resEntries.some(([res]) => res.includes(q));
      const skinMatch = resEntries.some(([, skins]) => skins.some(s => s.includes(q)));
      if (!weaponMatch && !resMatch && !skinMatch) return;
    }

    count++;
    const autoOpen = q.length > 0;

    html += `<div class="weapon-card${autoOpen ? ' open' : ''}" onclick="this.classList.toggle('open')">`;
    html += `<div class="weapon-header">`;
    html += `<span class="chevron">&#9654;</span>`;
    html += `<span class="weapon-name">${highlight(weapon, q)}</span>`;
    html += `<span class="weapon-res-pills">`;
    resEntries.forEach(([res, skins]) => {
      html += `<span class="res-pill">${highlight(res, q)}<span class="pill-count">${skins.length}</span></span>`;
    });
    html += `</span>`;
    html += `<span class="weapon-total">${total} skins</span>`;
    html += `</div>`;

    html += `<div class="weapon-body" onclick="event.stopPropagation()">`;
    resEntries.forEach(([res, skins]) => {
      html += `<div class="res-group">`;
      html += `<div class="res-group-header">${res} &mdash; ${skins.length} skins</div>`;
      html += `<div class="skin-list">`;
      skins.sort().forEach(s => {
        html += `<span class="skin-item">${highlight(s, q)}</span>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });

  if (!count) html = '<div class="no-results">No weapons match your search</div>';
  container.innerHTML = html;
}

document.getElementById('search').addEventListener('input', render);
render();
</script>
