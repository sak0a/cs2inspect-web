# Coolify All-in-One Docker Compose (Service Stack)
# Deploys the complete stack: MariaDB + Web App + Steam Service
# All services share a single Docker network — no TLS/proxy issues.
#
# Uses pre-built images from GHCR (built by GitHub Actions on push to master).
# → ghcr.io/sak0a/cs2inspect-web:latest
# → ghcr.io/sak0a/cs2inspect-web-steam-service:latest
#
# Usage in Coolify:
#   1. New Resource → Docker Compose Empty (Service Stack)
#   2. Paste this file (or point to repo)
#   3. Each service appears separately — configure env vars per service
#   4. Deploy
#   5. Run `bun run db:push` in the web container after first deploy
#
# IMPORTANT: Some values must match across services:
#   - MYSQL_PASSWORD (database) = DATABASE_PASSWORD (web)
#   - MYSQL_USER (database) = DATABASE_USER (web)
#   - MYSQL_DATABASE (database) = DATABASE_NAME (web)
#   - STEAM_API_KEY → same on 'web' and 'steam-service'
#   - API_KEYS (steam-service) must contain STEAM_SERVICE_API_KEY (web)

services:

  # ─── MariaDB Database ──────────────────────────────────────
  database:
    image: mariadb:${MARIADB_VERSION:-11}
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme-root-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cs2inspect}
      - MYSQL_USER=${MYSQL_USER:-cs2inspect}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme-db-password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # External port for plugin / external tool access.
      # Change via DATABASE_PORT_PUBLIC (e.g. 5766) or leave default 3306.
      # Internal services always use 'database:3306' on the shared network.
      - "${DATABASE_PORT_PUBLIC:-3306}:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-100}

  # ─── Steam Service ─────────────────────────────────────────
  steam-service:
    image: ghcr.io/sak0a/cs2inspect-web-steam-service:${STEAM_SERVICE_IMAGE_TAG:-latest}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=${STEAM_SERVICE_PORT:-3001}
      - HOST=0.0.0.0
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - API_KEYS=${API_KEYS}
      - STEAM_USERNAME=${STEAM_USERNAME:-}
      - STEAM_PASSWORD=${STEAM_PASSWORD:-}
      - LOG_API_REQUESTS=${LOG_API_REQUESTS:-false}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60000}
      - STEAM_RATE_LIMIT_DELAY=${STEAM_RATE_LIMIT_DELAY:-1500}
      - STEAM_MAX_QUEUE_SIZE=${STEAM_MAX_QUEUE_SIZE:-100}
      - STEAM_REQUEST_TIMEOUT=${STEAM_REQUEST_TIMEOUT:-10000}
      - STEAM_QUEUE_TIMEOUT=${STEAM_QUEUE_TIMEOUT:-30000}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${STEAM_SERVICE_PORT:-3001}/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Web Application ───────────────────────────────────────
  web:
    image: ghcr.io/sak0a/cs2inspect-web:${WEB_IMAGE_TAG:-latest}
    restart: always
    environment:
      # Core
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      # JWT (generate with: openssl rand -hex 32)
      - JWT_TOKEN=${JWT_TOKEN:-changeme-jwt-token}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      # Database — must match the values on 'database' service
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-cs2inspect}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-changeme-db-password}
      - DATABASE_NAME=${DATABASE_NAME:-cs2inspect}
      - DATABASE_CONNECTION_LIMIT=${DATABASE_CONNECTION_LIMIT:-10}
      # Steam API key (must match the one on 'steam-service')
      - STEAM_API_KEY=${STEAM_API_KEY}
      # Steam Service connection — internal hostname, no TLS needed
      - STEAM_SERVICE_URL=${STEAM_SERVICE_URL:-http://steam-service:${STEAM_SERVICE_PORT:-3001}}
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_KEY}
      # Logging
      - LOG_API_REQUESTS=${LOG_API_REQUESTS:-false}
      # Assets
      - ASSETS_URL=${ASSETS_URL:-}
      - ASSETS_STICKER_PATH=${ASSETS_STICKER_PATH:-/stickers}
      - ASSETS_CHARMS_PATH=${ASSETS_CHARMS_PATH:-/charms}
      - ASSETS_WEAPONS_PATH=${ASSETS_WEAPONS_PATH:-/weapons}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      database:
        condition: service_healthy
      steam-service:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-3000}/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
    driver: local
