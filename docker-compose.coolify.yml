# Coolify All-in-One Docker Compose
# Deploys the complete stack: MariaDB + Web App + Steam Service
# All services share a single Docker network — no TLS/proxy issues.
#
# Usage in Coolify:
#   1. Create a Docker Compose resource
#   2. Point to this repo, set Compose File to: docker-compose.coolify.yml
#   3. Deploy — each service appears separately in Coolify with its own env panel
#   4. Configure environment variables per service (see comments below)
#   5. Run `bun run db:push` in the web container after first deploy
#
# IMPORTANT: Some values must match across services:
#   - DATABASE_PASSWORD + DATABASE_USER + DATABASE_NAME → same on 'database' and 'web'
#   - STEAM_API_KEY → same on 'web' and 'steam-service'
#   - API key for steam-service auth → API_KEYS on 'steam-service', STEAM_SERVICE_API_KEY on 'web'

services:

  # ─── MariaDB Database ──────────────────────────────────────
  # Configure in Coolify: click on 'database' → Environment Variables
  database:
    image: mariadb:11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=changeme-root-password
      - MYSQL_DATABASE=cs2inspect
      - MYSQL_USER=cs2inspect
      - MYSQL_PASSWORD=changeme-db-password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # External port for plugin / external tool access.
      # Change the left side to a non-standard port (e.g. 5766:3306) if needed.
      # Internal services (web) always use 'database:3306' on the shared network.
      - "3306:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100

  # ─── Steam Service ─────────────────────────────────────────
  # Configure in Coolify: click on 'steam-service' → Environment Variables
  steam-service:
    build:
      context: ./services/steam-service
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      # CORS Allowed Origins
      - CORS_ORIGINS=
      # Steam API key (must match the one on 'web')
      - STEAM_API_KEY=your_steam_api_key
      # Comma-separated API keys that clients must send to authenticate
      - API_KEYS=your_service_api_key
      # Steam bot account (optional — needed for unmasked inspect URLs)
      - STEAM_USERNAME=
      - STEAM_PASSWORD=
      # Logging & tuning
      - LOG_API_REQUESTS=false
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60000
      - STEAM_RATE_LIMIT_DELAY=1500
      - STEAM_MAX_QUEUE_SIZE=100
      - STEAM_REQUEST_TIMEOUT=10000
      - STEAM_QUEUE_TIMEOUT=30000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Web Application ───────────────────────────────────────
  # Configure in Coolify: click on 'web' → Environment Variables
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Core
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0

      # JWT (generate with: openssl rand -hex 32)
      - JWT_TOKEN=changeme-jwt-token
      - JWT_EXPIRY=7d

      # Database — must match the values on 'database' service
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=cs2inspect
      - DATABASE_PASSWORD=changeme-db-password
      - DATABASE_NAME=cs2inspect
      - DATABASE_CONNECTION_LIMIT=10

      # Steam API key (must match the one on 'steam-service')
      - STEAM_API_KEY=your_steam_api_key

      # Steam Service connection — internal hostname, no TLS needed
      - STEAM_SERVICE_URL=http://steam-service:3001
      # API key to authenticate with steam-service (must be listed in API_KEYS on 'steam-service')
      - STEAM_SERVICE_API_KEY=your_service_api_key

      # Logging
      - LOG_API_REQUESTS=false

      # Assets
      - ASSETS_URL=
      - ASSETS_STICKER_PATH=/stickers
      - ASSETS_CHARMS_PATH=/charms
      - ASSETS_WEAPONS_PATH=/weapons
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      steam-service:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
    driver: local
