# Coolify All-in-One Docker Compose
# Deploys the complete stack: MariaDB + Web App + Steam Service
# All services share a single Docker network — no TLS/proxy issues.
#
# Usage in Coolify:
#   1. Create a Docker Compose resource
#   2. Point to this repo, set Compose File to: docker-compose.coolify.yml
#   3. Set environment variables (see below)
#   4. Deploy
#   5. Run `bun run db:push` in the web container after first deploy
#
# Required environment variables:
#   DATABASE_ROOT_PASSWORD, DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD
#   JWT_TOKEN
#   STEAM_API_KEY
#   STEAM_SERVICE_API_KEYS  (comma-separated keys the web app uses to auth with steam-service)
#   STEAM_SERVICE_API_KEY    (the key the web app sends — must be in STEAM_SERVICE_API_KEYS)
#
# Optional:
#   STEAM_USERNAME, STEAM_PASSWORD  (for unmasked inspect URLs)
#   PORT (default 3000), STEAM_SERVICE_PORT (default 3001)
#   DATABASE_PORT_PUBLIC (external port for MariaDB, default 3306 — needed for plugin/external access)
#   STEAM_SERVICE_URL (default: http://steam-service:<STEAM_SERVICE_PORT>)
#   MARIADB_VERSION (default 10.11), MARIADB_MAX_CONNECTIONS (default 100)

services:
  database:
    image: mariadb:${MARIADB_VERSION:-11}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-csinspect}
      MYSQL_USER: ${DATABASE_USER:-csinspect}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-csinspect-pw}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Exposed externally so the plugin / external tools can connect.
      # Change DATABASE_PORT_PUBLIC to use a non-standard port (e.g. 5766).
      # Internal services (web) always use the 'database' hostname on port 3306.
      - "${DATABASE_PORT_PUBLIC:-3306}:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-100}

  steam-service:
    build:
      context: ./services/steam-service
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=${STEAM_SERVICE_PORT:-3001}
      - HOST=0.0.0.0
      - STEAM_USERNAME=${STEAM_USERNAME:-}
      - STEAM_PASSWORD=${STEAM_PASSWORD:-}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - API_KEYS=${STEAM_SERVICE_API_KEYS}
      - LOG_API_REQUESTS=${LOG_API_REQUESTS:-false}
      - STEAM_RATE_LIMIT_DELAY=${STEAM_RATE_LIMIT_DELAY:-1500}
      - STEAM_MAX_QUEUE_SIZE=${STEAM_MAX_QUEUE_SIZE:-100}
      - STEAM_REQUEST_TIMEOUT=${STEAM_REQUEST_TIMEOUT:-10000}
      - STEAM_QUEUE_TIMEOUT=${STEAM_QUEUE_TIMEOUT:-30000}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${STEAM_SERVICE_PORT:-3001}/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      # Core
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0

      # JWT
      - JWT_TOKEN=${JWT_TOKEN}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}

      # Database — uses the 'database' service name on the internal network
      - DATABASE_HOST=database
      - DATABASE_PORT=3306
      - DATABASE_USER=${DATABASE_USER:-csinspect}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-csinspect-pw}
      - DATABASE_NAME=${DATABASE_NAME:-csinspect}
      - DATABASE_CONNECTION_LIMIT=${DATABASE_CONNECTION_LIMIT:-10}

      # Steam
      - STEAM_API_KEY=${STEAM_API_KEY}

      # Steam Service — defaults to internal network hostname, override for external
      - STEAM_SERVICE_URL=${STEAM_SERVICE_URL:-http://steam-service:${STEAM_SERVICE_PORT:-3001}}
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_KEY}

      # Logging
      - LOG_API_REQUESTS=${LOG_API_REQUESTS:-false}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      database:
        condition: service_healthy
      steam-service:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-3000}/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
    driver: local
