name: Build Docker Images

# Builds and pushes Docker images to GHCR.
#
# Triggers:
#   - Push to master        → :latest, :master, :master-{sha}
#   - Push to dev           → :dev, :dev-{sha}
#   - Tag push (v1.2.3)    → :v1.2.3, :1.2  (direct tag push or triggered by release workflow)
#   - Manual dispatch       → tags based on current branch/ref
#
# Images:
#   ghcr.io/sak0a/cs2inspect-web:<tag>
#   ghcr.io/sak0a/cs2inspect-web-steam-service:<tag>
#
# In Coolify, set WEB_IMAGE_TAG and SS_IMAGE_TAG to pick which tag to deploy.
#   Dev:  WEB_IMAGE_TAG=dev        (auto-built on push to dev branch)
#   Prod: WEB_IMAGE_TAG=v1.2.3     (built when you create a release)

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Build platforms (add linux/arm64 if needed)'
        required: false
        default: 'linux/amd64'

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64' }}

      - name: Summary
        run: |
          echo "## Web Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-steam-service:
    name: Build Steam Service Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-steam-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/steam-service
          file: ./services/steam-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=steam-service
          cache-to: type=gha,scope=steam-service,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64' }}

      - name: Summary
        run: |
          echo "## Steam Service Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
