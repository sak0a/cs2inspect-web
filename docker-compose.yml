version: "3.9"

services:
  steam-service:
    container_name: cs2inspect-steam-service
    build:
      context: ./services/steam-service
      dockerfile: Dockerfile
    image: cs2inspect-steam-service:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${STEAM_SERVICE_PORT:-3001}
      - HOST=${STEAM_SERVICE_HOST:-0.0.0.0}
      - STEAM_USERNAME=${STEAM_USERNAME}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - API_KEYS=${STEAM_SERVICE_API_KEYS}
      - CORS_ORIGINS=${STEAM_SERVICE_CORS_ORIGINS:-http://localhost:3000}
      - LOG_API_REQUESTS=${LOG_API_REQUESTS}
      - STEAM_RATE_LIMIT_DELAY=${STEAM_RATE_LIMIT_DELAY:-1500}
      - STEAM_MAX_QUEUE_SIZE=${STEAM_MAX_QUEUE_SIZE:-100}
      - STEAM_REQUEST_TIMEOUT=${STEAM_REQUEST_TIMEOUT:-10000}
      - STEAM_QUEUE_TIMEOUT=${STEAM_QUEUE_TIMEOUT:-30000}
    ports:
      - "${STEAM_SERVICE_PORT:-3001}:${STEAM_SERVICE_PORT:-3001}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${STEAM_SERVICE_PORT:-3001}/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  web:
    container_name: cs2inspect-web
    build:
      context: .
      dockerfile: Dockerfile
    image: cs2inspect-web:latest
    restart: unless-stopped
    environment:
      # Core
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOST=${HOST:-0.0.0.0}

      # JWT / Auth
      - JWT_TOKEN=${JWT_TOKEN}
      - JWT_EXPIRY=${JWT_EXPIRY}

      # Database (handled separately; only passing through connection envs)
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_CONNECTION_LIMIT=${DATABASE_CONNECTION_LIMIT}

      # Steam (optional - only needed if not using steam-service)
      - STEAM_API_KEY=${STEAM_API_KEY}
      - STEAM_USERNAME=${STEAM_USERNAME}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      
      # Steam Service (if using external service)
      - STEAM_SERVICE_URL=${STEAM_SERVICE_URL:-http://steam-service:3001}
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_KEY}

      # Misc
      - LOG_API_REQUESTS=${LOG_API_REQUESTS}

    ports:
      # Map host:container ports, defaulting to 3000 if not set in Coolify
      - "${PORT:-3000}:${PORT:-3000}"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # No database service here; Coolify manages DB separately
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
